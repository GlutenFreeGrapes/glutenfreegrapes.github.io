        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
        <script>
            // Execute the fetch immediately when the DOM is fully parsed and loaded
            window.addEventListener('DOMContentLoaded', function() {
            
            // Use dot-relative path to keep the GitHub repository folder context
            fetch('./assets/projects.tsv')
                .then(function(response) {
                if (!response.ok) {
                    throw new Error('Network response was not ok: ' + response.status);
                }
                return response.text(); // Extract text from the tsv file
                })
                .then(function(tsvText) {
                // Your file content is loaded here without async/await
                // console.log('TSV data loaded successfully:');
                // console.log(tsvText);
                
                // Call your data processing functions here
                processMyData(tsvText);
                })
                .catch(function(error) {
                console.error('There was a problem loading the TSV file:', error);
                });
                
            });

            // Example placeholder function to handle the data next
            function processMyData(allText) {
                // Do your work with the string here
                let projects_list = document.querySelector(".projects-list");
                let data = allText.split('\n');

                for (var row in data) {
                    let project = data[row].split('\t');
                    let title = project[0];
                    let url = project[1];
                    let tech = project[2];
                    let dates = project[3];
                    let bullets = project.slice(4);

                    let project_li = document.createElement("li");

                    let project_h2 = document.createElement("h2");
                    project_h2.innerText = title;

                    if (url !== "") {
                        let href = document.createElement("a");
                        href.setAttribute("href", url);

                        let icon = document.createElement("ion-icon");
                        icon.setAttribute("size", "small");
                        icon.setAttribute("name", "link");
                        
                        href.appendChild(icon);
                        project_h2.appendChild(href);
                    }
                    project_li.appendChild(project_h2);

                    let project_date = document.createElement("h3");
                    project_date.innerText = dates + " | ";
                    let project_tech = document.createElement("em");
                    project_tech.innerText = tech;
                    project_date.appendChild(project_tech)
                    project_li.appendChild(project_date)

                    let project_description = document.createElement("ul");
                    project_description.setAttribute("class", "description")
                    for (var description in bullets) {
                        let project_description_bullet = document.createElement("li");
                        project_description_bullet.innerText = bullets[description];

                        project_description.appendChild(project_description_bullet);
                    }
                    project_li.appendChild(project_description);

                    projects_list.appendChild(project_li);
                }
            }
        </script>
